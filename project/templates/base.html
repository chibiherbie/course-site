<!-- templates/base.html -->

<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SibHub</title>
    <link rel="icon" href="/static/sh_logo.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,700" rel="stylesheet">
</head>

<body>
    <section class="hero is-info is-fullheight">
        <div class="hero-head">
            <nav class="navbar">
                <div class="container">
                    <div class="navbar-brand">
                        <a href="{{ url_for('main.index') }}" class="navbar-item">
                                <img src="/static/sh_logo.png" alt="Logo" width="36" height="20">
                        </a>
                        <div role="button" class="navbar-burger" aria-label="menu" aria-expanded="false" data-target="navbar-true"
                        onclick="document.querySelector('.navbar-menu').classList.toggle('is-active');document.querySelector('.navbar-burger').classList.toggle('is-active');">
                            <span aria-hidden="true"></span>
                            <span aria-hidden="true"></span>
                            <span aria-hidden="true"></span>
                        </div>
                    </div>

                    <div id="navbar-true" class="navbar-menu">
                        <div class="navbar-end">
                            <a class="navbar-item" href="{{ url_for('main.index') }}">
                                Главная
                            </a>

                            {% if current_user.is_authenticated %}
                            <a href="{{ url_for('main.lessons') }}" class="navbar-item">
                                Задачи
                            </a>
                            <a href="{{ url_for('main.profile') }}" class="navbar-item">
                                Профиль
                            </a>
                            {% endif %}

                            {% if not current_user.is_authenticated %}
                            <a href="{{ url_for('auth.login') }}" class="navbar-item">
                                Войти
                            </a>
                            <a href="{{ url_for('auth.signup') }}" class="navbar-item">
                                Регестрация
                            </a>
                            {% endif %}
                            {% if current_user.is_authenticated %}
                            <a href="{{ url_for('auth.logout') }}" class="navbar-item has-text-danger-dark">
                                <span>Выйти</span>
                            </a>
                            {% endif %}
                        </div>
                    </div>
                </div>
            </nav>
        </div>

        <div class="hero-body">
            <div class="container has-text-centered">
               {% block content %}
               {% endblock %}
            </div>
        </div>
    </section>
</body>

</html>
